name: 🟡 Pac-Man Animation

on:
  schedule:
    - cron: '0 1 * * *'  # roda todo dia 1h da manhã UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar pacman.svg corretamente
        run: |
          mkdir -p dist
          curl -L https://raw.githubusercontent.com/denvercoder1/github-contribution-pacman/main/pacman.svg -o dist/pacman.svg
          file dist/pacman.svg
          cat dist/pacman.svg | head -n 5

      - name: Publicar na branch output (sem apagar o arquivo da cobrinha)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true
