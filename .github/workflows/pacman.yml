# .github/workflows/pacman.yml
name: 🟡 Pac-Man Animation

on:
  schedule:
    - cron: '0 1 * * *'  # roda todo dia 1h da manhã UTC
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v3

      - name: Baixar arquivo SVG do Pac-Man
        run: |
          mkdir -p dist
          curl -L -o dist/pacman.svg https://raw.githubusercontent.com/denvercoder1/github-contribution-pacman/main/pacman.svg

      - name: Publicar na branch output (sem apagar os outros arquivos)
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
          keep_files: true  # ⬅️ ESSENCIAL para manter a snake.svg na branch output
